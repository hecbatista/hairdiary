# Typecheck, lint, format check and unit tests on every PR and every push to main.
# Needs no secrets: tests run against the Supabase mock (lib/__mocks__/supabase.ts), not a real stack.
name: CI

on:
    pull_request:
    push:
        branches: [main]

# Cancel an older run on the same branch or PR when a new commit is pushed.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: Typecheck, lint, format, test
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  # Expo SDK 54 needs Node 20.19.4 or newer; use the 22 LTS line.
                  node-version: 22
                  cache: npm

            - run: npm ci

            - name: Typecheck
              run: npx tsc --noEmit

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Test
              run: npm test -- --ci
